name: tavern-human-review-package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tavern-human-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-review-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAVERN_ARCHIVE: /tmp/TAVERN-master.zip
      TAVERN_EXPECTED_SHA256: b95d85bb3f1e5c0f4ea6df772928d247243485abd93153f0550d6be2fba4fc63
      TAVERN_URL: https://github.com/jcdevaney/TAVERN/archive/refs/heads/master.zip
      TAVERN_COMPARISON: /tmp/stage0l_tavern_ab_comparison.v1.json
      TAVERN_REVIEW_BASE_DIR: /tmp/stage0n-tavern-human-review-base
      TAVERN_REVIEW_SCORE_DIR: /tmp/stage0n1-tavern-score-aware-review
      TAVERN_REVIEW_DIR: /tmp/stage0n2-tavern-score-aware-review-tr
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
          cache: ''
      - name: Repository security guard
        run: python scripts/repo_guard.py
      - name: Download upstream archive to ephemeral storage
        run: |
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --max-filesize 268435456 \
            "$TAVERN_URL" --output "$TAVERN_ARCHIVE"
      - name: Verify raw archive integrity before parsing
        run: printf '%s  %s\n' "$TAVERN_EXPECTED_SHA256" "$TAVERN_ARCHIVE" | sha256sum --check --strict
      - name: Rebuild pinned Stage 0-L comparison evidence
        run: |
          python -m scripts.compare_tavern_ab \
            --archive "$TAVERN_ARCHIVE" \
            --phrase-gate-evidence evidence/tavern/stage0k_tavern_phrase_gate.v1.json \
            --output "$TAVERN_COMPARISON"
      - name: Build base human review package
        run: |
          python -m scripts.build_tavern_review_package \
            --archive "$TAVERN_ARCHIVE" \
            --comparison "$TAVERN_COMPARISON" \
            --output-dir "$TAVERN_REVIEW_BASE_DIR" \
            --batch-size 25
      - name: Add pinned score phrase references
        run: |
          python -m scripts.enrich_tavern_review_with_scores \
            --source-dir "$TAVERN_REVIEW_BASE_DIR" \
            --archive "$TAVERN_ARCHIVE" \
            --output-dir "$TAVERN_REVIEW_SCORE_DIR"
      - name: Localize review UI and decisions to Turkish
        run: |
          python -m scripts.localize_tavern_review_tr \
            --source-dir "$TAVERN_REVIEW_SCORE_DIR" \
            --output-dir "$TAVERN_REVIEW_DIR"
      - name: Verify final Turkish package integrity
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['TAVERN_REVIEW_DIR'])
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          if manifest['schema_version'] != 'st-tavern-score-aware-review-tr-v1':
              raise SystemExit('unexpected Turkish review schema')
          if manifest['review_ui_language'] != 'tr':
              raise SystemExit('review UI is not Turkish')
          if manifest['pair_count'] != 937:
              raise SystemExit('unexpected real pair count')
          if manifest['batch_count'] != 38:
              raise SystemExit('unexpected batch count')
          if not manifest['decision_codes_preserved']:
              raise SystemExit('machine decision codes were not preserved')
          if manifest['decisions_preselected']:
              raise SystemExit('review package contains preselected decisions')
          if any(manifest[field] is not False for field in (
              'gold_assignment_authorized',
              'partition_assignment_authorized',
              'training_authorized',
          )):
              raise SystemExit('review package must remain non-authoritative')

          total = 0
          for batch in manifest['batches']:
              path = root / batch['filename']
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != batch['sha256']:
                  raise SystemExit(f'batch hash mismatch: {path.name}')
              text = path.read_text(encoding='utf-8')
              total += batch['record_count']
              if '<html lang="tr">' not in text:
                  raise SystemExit(f'non-Turkish batch language: {path.name}')
              if 'A analizi daha doğru' not in text and 'İki analiz eşdeğer' not in text:
                  raise SystemExit(f'Turkish decision labels missing: {path.name}')
              if '<input type="radio"' in text and ' checked' in text.split('<script', 1)[0]:
                  raise SystemExit(f'preselected review decision: {path.name}')
          if total != 937:
              raise SystemExit(f'localized record total mismatch: {total}')
          actual_index = hashlib.sha256((root / 'index.html').read_bytes()).hexdigest()
          if actual_index != manifest['index_sha256']:
              raise SystemExit('index hash mismatch')
          print(json.dumps({
              'schema_version': manifest['schema_version'],
              'review_ui_language': manifest['review_ui_language'],
              'pair_count': manifest['pair_count'],
              'batch_count': manifest['batch_count'],
              'decision_codes_preserved': manifest['decision_codes_preserved'],
              'decisions_preselected': manifest['decisions_preselected'],
              'final_hashes_verified': True,
              'training_authorized': manifest['training_authorized'],
          }, sort_keys=True, ensure_ascii=False))
          PY
      - name: Upload short-lived Turkish score-aware review package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage0n2-tavern-score-aware-human-review-tr
          path: /tmp/stage0n2-tavern-score-aware-review-tr
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          include-hidden-files: false
