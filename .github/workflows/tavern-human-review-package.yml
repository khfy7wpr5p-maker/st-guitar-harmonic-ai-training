name: tavern-human-review-package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tavern-human-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-review-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAVERN_ARCHIVE: /tmp/TAVERN-master.zip
      TAVERN_EXPECTED_SHA256: b95d85bb3f1e5c0f4ea6df772928d247243485abd93153f0550d6be2fba4fc63
      TAVERN_URL: https://github.com/jcdevaney/TAVERN/archive/refs/heads/master.zip
      TAVERN_COMPARISON: /tmp/stage0l_tavern_ab_comparison.v1.json
      TAVERN_REVIEW_DIR: /tmp/stage0n-tavern-human-review
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
          cache: ''
      - name: Repository security guard
        run: python scripts/repo_guard.py
      - name: Download upstream archive to ephemeral storage
        run: |
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --max-filesize 268435456 \
            "$TAVERN_URL" --output "$TAVERN_ARCHIVE"
      - name: Verify raw archive integrity before parsing
        run: printf '%s  %s\n' "$TAVERN_EXPECTED_SHA256" "$TAVERN_ARCHIVE" | sha256sum --check --strict
      - name: Rebuild pinned Stage 0-L comparison evidence
        run: |
          python -m scripts.compare_tavern_ab \
            --archive "$TAVERN_ARCHIVE" \
            --phrase-gate-evidence evidence/tavern/stage0k_tavern_phrase_gate.v1.json \
            --output "$TAVERN_COMPARISON"
      - name: Build human review package
        run: |
          python -m scripts.build_tavern_review_package \
            --archive "$TAVERN_ARCHIVE" \
            --comparison "$TAVERN_COMPARISON" \
            --output-dir "$TAVERN_REVIEW_DIR" \
            --batch-size 25
      - name: Print bounded package summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads((Path(os.environ['TAVERN_REVIEW_DIR']) / 'manifest.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'schema_version': manifest['schema_version'],
              'pair_count': manifest['pair_count'],
              'relation_counts': manifest['relation_counts'],
              'batch_size': manifest['batch_size'],
              'batch_count': manifest['batch_count'],
              'raw_annotation_text_in_ephemeral_package': manifest['raw_annotation_text_in_ephemeral_package'],
              'raw_annotation_text_committed': manifest['raw_annotation_text_committed'],
              'decisions_preselected': manifest['decisions_preselected'],
              'gold_assignment_authorized': manifest['gold_assignment_authorized'],
              'partition_assignment_authorized': manifest['partition_assignment_authorized'],
              'training_authorized': manifest['training_authorized'],
          }, sort_keys=True))
          PY
      - name: Upload short-lived human review package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage0n-tavern-human-review
          path: /tmp/stage0n-tavern-human-review
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          include-hidden-files: false
