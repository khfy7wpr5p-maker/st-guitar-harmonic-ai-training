name: tavern-real-ab-evidence

on:
  pull_request:
    paths:
      - '.github/workflows/tavern-real-ab-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tavern-real-ab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-real-tavern-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAVERN_ARCHIVE: /tmp/TAVERN-master.zip
      TAVERN_EXPECTED_SHA256: b95d85bb3f1e5c0f4ea6df772928d247243485abd93153f0550d6be2fba4fc63
      TAVERN_URL: https://github.com/jcdevaney/TAVERN/archive/refs/heads/master.zip
      TAVERN_EVIDENCE: /tmp/stage0l_tavern_ab_comparison.v1.json
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
          cache: ''
      - name: Repository security guard
        run: python scripts/repo_guard.py
      - name: Download upstream archive to ephemeral storage
        run: |
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --max-filesize 268435456 \
            "$TAVERN_URL" --output "$TAVERN_ARCHIVE"
      - name: Verify raw archive integrity before parsing
        run: printf '%s  %s\n' "$TAVERN_EXPECTED_SHA256" "$TAVERN_ARCHIVE" | sha256sum --check --strict
      - name: Compare real A and B evidence
        run: |
          python -m scripts.compare_tavern_ab \
            --archive "$TAVERN_ARCHIVE" \
            --phrase-gate-evidence evidence/tavern/stage0k_tavern_phrase_gate.v1.json \
            --output "$TAVERN_EVIDENCE"
      - name: Print bounded comparison summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['TAVERN_EVIDENCE'])
          payload = path.read_bytes()
          data = json.loads(payload)
          print(json.dumps({
              'schema_version': data['schema_version'],
              'pair_count': data['pair_count'],
              'relation_counts': data['relation_counts'],
              'evidence_sha256': hashlib.sha256(payload).hexdigest(),
              'adjudication_authorized': data['adjudication_authorized'],
              'gold_assignment_authorized': data['gold_assignment_authorized'],
              'partition_assignment_authorized': data['partition_assignment_authorized'],
              'training_authorized': data['training_authorized'],
          }, sort_keys=True))
          PY
      - name: Upload comparison evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage0l-tavern-ab-comparison
          path: /tmp/stage0l_tavern_ab_comparison.v1.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
